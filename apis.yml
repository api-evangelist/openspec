aid: openspec
name: Openspec
description: >-
  OpenSpec (by Fission-AI) is an open-source, lightweight spec-driven development
  (SDD) framework for AI coding assistants. It adds a durable spec layer so you
  and your coding agent agree on what to build before any code is written: each
  change gets its own folder with a proposal, specs, design, and tasks, following
  a propose - apply - archive workflow. OpenSpec is a CLI and agent contract
  (installed via npm, no API keys or MCP required) that works with 30+ AI tools
  including Claude Code, Cursor, Windsurf, and Copilot via slash commands. A
  Y Combinator company, OpenSpec has 60k+ GitHub stars and is building Workspaces
  for teams needing multi-repo planning and collaboration.
